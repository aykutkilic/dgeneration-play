<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>D/Generation (three.js remake)</title>
<meta name="description" content="A browser remake of the 1991 isometric action-puzzle game D/Generation, built with three.js.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Cpath d='M3 3h4l3 5-3 5H3z' fill='%23ff4a6a'/%3E%3Cpath d='M9 13l4-10' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/VT323-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="scene-label"></div>
<div id="hud" style="display:none">
  <div class="msg"></div>
  <div class="stats"></div>
</div>
<div id="touch">
  <div class="stick"><div class="knob"></div></div>
  <div class="btns">
    <button data-act="fire" class="b-fire">FIRE</button>
    <button data-act="grenade">GREN</button>
    <button data-act="use">ITEM</button>
    <button data-act="cycle">NEXT</button>
    <button data-act="talk">TALK</button>
    <button data-menu>II</button>
  </div>
</div>
<div id="overlay"></div>
<div id="ui"></div>
<noscript>This game needs JavaScript and WebGL.</noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
